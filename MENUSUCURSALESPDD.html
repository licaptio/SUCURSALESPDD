button,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--text);text-decoration:none}

main{max-width:1400px;margin:18px auto;padding:0 18px 40px}.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px;box-shadow:0 3px 16px rgba(23,32,51,.05)}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,94,255,.1)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:0 6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 28px;box-shadow:0 3px 16px rgba(23,32,51,.05);overflow:auto}
.treeRoot{min-width:680px}.tree ul{list-style:none;margin:0;padding-left:34px;position:relative}.tree ul::before{content:"";position:absolute;top:0;bottom:17px;left:15px;border-left:2px solid var(--branch)}
.tree li{position:relative;margin:0;padding:2px 0 2px 24px}.tree li::before{content:"";position:absolute;left:-19px;top:22px;width:28px;border-top:2px solid var(--branch)}
.tree li:last-child::after{content:"";position:absolute;left:-20px;top:24px;bottom:-5px;width:4px;background:var(--panel)}
.nodeRow{min-height:42px;display:flex;align-items:center;gap:9px;border-radius:9px;padding:7px 10px;position:relative;z-index:1}.nodeRow:hover{background:var(--hover)}
.folderDetails{margin:0}.folderDetails>summary{list-style:none;cursor:pointer}.folderDetails>summary::-webkit-details-marker{display:none}
.chev{width:18px;height:18px;display:inline-grid;place-items:center;font-size:12px;color:#5f6f86;transition:transform .15s}.folderDetails[open]>summary .chev{transform:rotate(90deg)}

let allPages=[];

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pageUrl(path){return new URL(path, location.href).href}
function buildTree(items){
  const root={folders:{},files:[]};
  for(const item of items){
    const parts=item.path.split('/');
    let node=root;
    parts.slice(0,-1).forEach(part=>{node=node.folders[part]??=( {folders:{},files:[]} )});
    node.files.push({name:parts.at(-1),path:item.path});
  }
  return root;
}
function countFiles(node){
  return node.files.length+Object.values(node.folders).reduce((n,x)=>n+countFiles(x),0);
}
function folderHtml(name,node,depth=0,forceOpen=false){
  const folders=Object.entries(node.folders).sort(([a],[b])=>a.localeCompare(b));
  const files=[...node.files].sort((a,b)=>a.name.localeCompare(b.name));
  const children=[
    ...folders.map(([n,x])=>folderHtml(n,x,depth+1,forceOpen)),
    ...files.map(fileHtml)
  ].join('');
  return `<li><details class="folderDetails" ${forceOpen||depth<1?'open':''}><summary class="nodeRow"><span class="chev">▶</span><span class="folderIcon">📁</span><span class="folderName">${esc(name)}</span><span class="count">${countFiles(node)}</span></summary><ul>${children}</ul></details></li>`;
}
function fileHtml(file){
  const url=esc(pageUrl(file.path));
  return `<li><div class="nodeRow fileRow"><div class="fileMain"><div class="fileName"><span class="fileIcon">📄</span> <a href="${url}" style="color:inherit;text-decoration:none">${esc(file.name)}</a></div><div class="filePath">${esc(file.path)}</div></div><div class="fileActions"><a class="btn mini" href="${url}">Abrir</a><a class="btn mini" href="${url}" target="_blank" rel="noopener">↗</a></div></div></li>`;
}
function render(filter=''){
  const q=filter.trim().toLowerCase();
  const items=q?allPages.filter(x=>x.path.toLowerCase().includes(q)):allPages;
  const tree=document.getElementById('tree');
  if(!items.length){tree.innerHTML='<div class="empty">No encontré páginas con ese texto.</div>';return}
  const root=buildTree(items);
  const content=[
    ...Object.entries(root.folders).sort(([a],[b])=>a.localeCompare(b)).map(([name,node])=>folderHtml(name,node,0,!!q)),
    ...root.files.sort((a,b)=>a.name.localeCompare(b.name)).map(fileHtml)
  ].join('');
  tree.innerHTML=`<div class="treeRoot"><div class="rootTitle">🏠 SUCURSALESPDD <span class="rootBadge">${items.length} HTML</span></div><ul>${content}</ul></div>`;
}
async function loadFromGitHub(){
  const api=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const r=await fetch(api,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error('GitHub API '+r.status);
  const data=await r.json();
  if(!Array.isArray(data.tree)) throw new Error('Respuesta inválida');
  return data.tree.filter(x=>x.type==='blob' && /\.html?$/i.test(x.path) && x.path!=='MENUSUCURSALESPDD.html').map(x=>({path:x.path}));
}
async function refreshTree(){
  const status=document.getElementById('status');
  status.textContent='Consultando repositorio…';
  try{
    const live=await loadFromGitHub();
    allPages=live.length?live:fallback;
    status.textContent=`${allPages.length} páginas · árbol actualizado desde GitHub`;
  }catch(e){
    allPages=fallback;
    status.textContent=`${allPages.length} páginas · usando copia incluida en este archivo`;
  }
  render(document.getElementById('q').value);
}
function setAll(open){document.querySelectorAll('details').forEach(d=>d.open=open)}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
refreshTree();
</script>
