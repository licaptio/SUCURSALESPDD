<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b91c1c">
  <title>Salida Abarrotes PDD</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="loading" class="overlay boot-overlay"><div class="boot-card center">
  <img src="assets/logo.jfif" class="logo boot-logo">
  <h2>Salida de Abarrotes PDD</h2>
  <div class="boot-animation" aria-hidden="true"><div class="boot-box b1"></div><div class="boot-box b2"></div><div class="boot-box b3"></div><div class="boot-line"></div></div>
  <p id="loadingText">Cargando datos...</p>
  <small class="boot-hint">Preparando inventario y catálogo de productos activos</small>
</div></div>
<div id="app" class="app hidden">
  <header>
    <img src="assets/logo.jfif" class="logo-sm">
    <div><b>SALIDA ABARROTES PDD</b><small id="sesionTxt">Sin sesión</small></div>
    <button id="menuBtn" class="iconbtn" aria-label="Menú">⋮</button>
  </header>

  <div id="menu" class="menu hidden">
    <button id="cartBtn">🛒 Ver carrito <span id="cartCount">0</span></button>
    <button id="cameraBtn">📷 Escanear código</button>
    <button id="extraProductBtn">➕ Ingresar producto del catálogo</button>
    <button id="configBtn">⚙️ Configuración</button>
    <button id="logoutBtn">↪ Cerrar sesión</button>
  </div>

  <section class="capture">
    <input id="scanInput" inputmode="text" autocomplete="off" placeholder="Código o descripción del producto">
    <button id="searchBtn" class="secondary">BUSCAR PRODUCTO</button>
    <div id="quickResults" class="quick-results hidden"></div>
  </section>

  <section class="recent-section">
    <div class="mobile-recent">
      <h3>Últimas 2 partidas</h3>
      <div id="lastItems" class="last"><div class="empty">Aún no hay partidas</div></div>
    </div>
    <div class="desktop-cart">
      <div class="desktop-cart-head">
        <h3>Carrito de salida</h3>
        <div id="desktopCartTotals" class="desktop-cart-totals">0 partidas · 0 unidades</div>
      </div>
      <div class="desktop-cart-columns">
        <span>#</span><span>PRODUCTO</span><span>CÓDIGO</span><span>CAJAS SALIERON</span><span>PZAS/CAJA</span><span>TOTAL PIEZAS</span><span>ACCIONES</span>
      </div>
      <div id="desktopCartList" class="desktop-cart-list"><div class="empty">Carrito vacío</div></div>
    </div>
  </section>

  <button id="finishBtn" class="finish">FINALIZAR SALIDA</button>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
