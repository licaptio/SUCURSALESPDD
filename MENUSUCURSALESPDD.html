*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:18px 22px}
.head{max-width:1200px;margin:auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0} .sub{font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:650;cursor:pointer;color:var(--text);text-decoration:none}
button:hover,.btn:hover{border-color:#aeb7c6} .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:18px auto;padding:0 18px 40px}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:14px;box-shadow:0 3px 16px rgba(23,32,51,.05)}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;outline:none} input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,94,255,.1)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:0 6px} .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tree{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 3px 16px rgba(23,32,51,.05)}
details{border-bottom:1px solid #edf0f4} details:last-child{border-bottom:0} summary{list-style:none;cursor:pointer;padding:12px 12px;border-radius:9px;font-weight:750;display:flex;align-items:center;gap:9px} summary::-webkit-details-marker{display:none} summary:hover{background:#f6f8fb}
.folderIcon{font-size:18px} .count{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600;background:#f0f2f6;border-radius:999px;padding:3px 7px}
.files{padding:0 8px 10px 34px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-left:2px solid #e5e9ef;padding:9px 10px;margin:2px 0 2px 4px}
.file:hover{background:#f8faff;border-left-color:var(--accent)} .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .path{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fileActions{display:flex;gap:6px} .mini{font-size:12px;padding:6px 9px;border-radius:8px}
.rootGroup{margin-bottom:6px} .empty{padding:40px;text-align:center;color:var(--muted)}
mark{background:#fff1a8;padding:0}
@media(max-width:650px){header{padding:14px} main{padding:0 10px 30px;margin-top:10px} .toolbar{grid-template-columns:1fr} .status{padding:0 2px} .file{grid-template-columns:1fr} .fileActions{justify-content:flex-start} .files{padding-left:18px} .actions{width:100%} .actions button,.actions .btn{flex:1;text-align:center}}

let allPages=[];

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pageUrl(path){return new URL(path, location.href).href}
function groupPages(items){
  const groups={};
  for(const x of items){
    const parts=x.path.split('/');
    const group=parts.length>1?parts[0]:'RAÍZ';
    (groups[group]??=[]).push(x.path);
  }
  return groups;
}
function render(filter=''){
  const q=filter.trim().toLowerCase();
  const items=q?allPages.filter(x=>x.path.toLowerCase().includes(q)):allPages;
  const groups=groupPages(items);
  const tree=document.getElementById('tree');
  if(!items.length){tree.innerHTML='<div class="empty">No encontré páginas con ese texto.</div>';return}
  tree.innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(group=>{
    const rows=groups[group].sort().map(path=>{
      const name=path.split('/').pop();
      return `<div class="file"><div><div class="name">📄 ${esc(name)}</div><div class="path">${esc(path)}</div></div><div class="fileActions"><a class="btn mini" href="${esc(pageUrl(path))}">Abrir</a><a class="btn mini" href="${esc(pageUrl(path))}" target="_blank" rel="noopener">Nueva pestaña ↗</a></div></div>`;
    }).join('');
    return `<details class="rootGroup" ${q?'open':''}><summary><span class="folderIcon">📁</span>${esc(group)}<span class="count">${groups[group].length} página${groups[group].length===1?'':'s'}</span></summary><div class="files">${rows}</div></details>`;
  }).join('');
}
async function loadFromGitHub(){
  const api=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;
  const r=await fetch(api,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error('GitHub API '+r.status);
  const data=await r.json();
  if(!Array.isArray(data.tree)) throw new Error('Respuesta inválida');
  return data.tree.filter(x=>x.type==='blob' && /\.html?$/i.test(x.path) && x.path!=='MENUSUCURSALESPDD.html').map(x=>({path:x.path}));
}
async function refreshTree(){
  const status=document.getElementById('status');
  status.textContent='Consultando repositorio…';
  try{
    const live=await loadFromGitHub();
    allPages=live.length?live:fallback;
    status.textContent=`${allPages.length} páginas · árbol actualizado desde GitHub`;
  }catch(e){
    allPages=fallback;
    status.textContent=`${allPages.length} páginas · usando copia incluida en este archivo`;
  }
  render(document.getElementById('q').value);
}
function setAll(open){document.querySelectorAll('details').forEach(d=>d.open=open)}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
refreshTree();
