<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PROVSOFT | Cigarro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:linear-gradient(135deg,#003b63,#0b6fa4);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.app{
  width:100%;
  height:100%;
  max-width:1400px;
  padding:24px 32px;
  display:flex;
  flex-direction:column;
}


/* =====================================================
   ENCABEZADO
===================================================== */

.header{
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-shrink:0;
}

.header img{
  width:58px;
  height:58px;
  object-fit:contain;
  background:#fff;
  border-radius:14px;
  padding:5px;
}

.tituloPrincipal{
  line-height:1.1;
}

.tituloPrincipal h1{
  margin:0;
  font-size:30px;
  letter-spacing:.5px;
}

.tituloPrincipal div{
  margin-top:6px;
  font-size:14px;
  opacity:.85;
}


/* =====================================================
   MENU
===================================================== */

.menu{
  flex:1;

  display:grid;

  grid-template-columns:
    repeat(3, minmax(250px, 330px));

  grid-template-rows:
    repeat(2, 190px);

  justify-content:center;
  align-content:center;

  gap:22px;

  padding:15px 0;
}


/* =====================================================
   TARJETAS
===================================================== */

.card{

  width:100%;
  height:190px;

  background:#fff;
  color:#1f2937;

  border-radius:20px;

  padding:22px;

  box-shadow:
    0 14px 34px rgba(0,0,0,.28);

  cursor:pointer;

  border:none;

  text-align:left;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  transition:
    transform .18s ease,
    box-shadow .18s ease;

}

.card:hover{

  transform:translateY(-5px);

  box-shadow:
    0 20px 40px rgba(0,0,0,.34);

}

.card:active{

  transform:translateY(-1px);

}


/* =====================================================
   ICONO
===================================================== */

.icono{

  width:54px;
  height:54px;

  border-radius:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  color:#fff;

}


/* =====================================================
   TITULO
===================================================== */

.titulo{

  font-size:19px;

  font-weight:800;

  margin-top:14px;

  line-height:1.15;

}


/* =====================================================
   DESCRIPCION
===================================================== */

.desc{

  margin-top:7px;

  font-size:13px;

  line-height:1.3;

  color:#667085;

}


/* =====================================================
   ABRIR
===================================================== */

.abrir{

  margin-top:10px;

  font-size:14px;

  font-weight:800;

  color:#0b6fa4;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  height:30px;

  text-align:center;

  font-size:12px;

  opacity:.8;

  flex-shrink:0;

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1050px){

  .menu{

    grid-template-columns:
      repeat(2, minmax(240px, 330px));

    grid-template-rows:
      repeat(3, 175px);

  }

  .card{
    height:175px;
  }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px){

  html,body{
    overflow:auto;
  }

  .app{

    min-height:100%;

    height:auto;

    padding:18px;

  }


  .header{

    height:80px;

    justify-content:flex-start;

  }


  .header img{

    width:50px;
    height:50px;

  }


  .tituloPrincipal h1{

    font-size:22px;

  }


  .tituloPrincipal div{

    font-size:12px;

  }


  .menu{

    grid-template-columns:1fr;

    grid-template-rows:none;

    gap:16px;

    padding:15px 0 25px;

  }


  .card{

    height:155px;

  }


  .titulo{

    font-size:18px;

  }

}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media(max-width:420px){

  .app{
    padding:14px;
  }

  .header{
    height:75px;
  }

  .header img{
    width:45px;
    height:45px;
  }

  .tituloPrincipal h1{
    font-size:19px;
  }

  .card{
    height:150px;
    padding:18px;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">

    <img
      src="logo_proveedora.webp"
      alt="Logo">

    <div class="tituloPrincipal">

      <h1>
        ALMACÉN CIGARRO
      </h1>

      <div>
        PROVSOFT
      </div>

    </div>

  </header>



  <!-- =================================================
       MENU
  ================================================== -->

  <main class="menu">


    <!-- ===============================================
         1. SALIDA CIGARRO
    ================================================ -->

    <button
      class="card"
      onclick="abrirApp('index.html')">

      <div>

        <div
          class="icono"
          style="background:#dc3545;">

          🚬

        </div>

        <div class="titulo">
          SALIDA CIGARRO
        </div>

        <div class="desc">
          Registrar salidas del almacén.
        </div>

      </div>

      <div class="abrir">
        Abrir →
      </div>

    </button>



    <!-- ===============================================
         2. REIMPRESIÓN
    ================================================ -->

    <button
      class="card"
      onclick="abrirApp('REIMPRESION.html')">

      <div>

        <div
          class="icono"
          style="background:#dc3545;">

          🖨️

        </div>

        <div class="titulo">
          REIMPRESIÓN DE SALIDAS
        </div>

        <div class="desc">
          Consultar y volver a imprimir
          salidas del almacén.
        </div>

      </div>

      <div class="abrir">
        Abrir →
      </div>

    </button>



    <!-- ===============================================
         3. TABLA CIGARRO
    ================================================ -->

    <button
      class="card"
      onclick="abrirApp('https://licaptio.github.io/SUCURSALESPDD/CIGARRO/TABLACIG/index.html')">

      <div>

        <div
          class="icono"
          style="background:#0b6fa4;">

          📋

        </div>

        <div class="titulo">
          TABLA CIGARRO
        </div>

        <div class="desc">
          Consultar movimientos y existencias.
        </div>

      </div>

      <div class="abrir">
        Abrir →
      </div>

    </button>



    <!-- ===============================================
         4. AGREGAR PRODUCTOS
    ================================================ -->

    <button
      class="card"
      onclick="abrirApp('https://licaptio.github.io/SUCURSALESPDD/CIGARRO/APPSALCIG/agregarproductosCIG.html')">

      <div>

        <div
          class="icono"
          style="background:#0b6fa4;">

          ➕

        </div>

        <div class="titulo">
          AGREGAR PRODUCTOS
        </div>

        <div class="desc">
          Consultar y agregar productos
          nuevos a la aplicación.
        </div>

      </div>

      <div class="abrir">
        Abrir →
      </div>

    </button>



    <!-- ===============================================
         5. APLICACIÓN SALIDA
    ================================================ -->

    <button
      class="card"
      onclick="abrirApp('https://licaptio.github.io/SUCURSALESPDD/CIGARRO/APPSALCIG/index.html')">

      <div>

        <div
          class="icono"
          style="background:#0b6fa4;">

          🚬

        </div>

        <div class="titulo">
          APLICACIÓN SALIDA CIGARRO
        </div>

        <div class="desc">
          Aplicación para registrar
          las salidas de cigarro.
        </div>

      </div>

      <div class="abrir">
        Abrir →
      </div>

    </button>


  </main>



  <!-- =================================================
       FOOTER
  ================================================== -->

  <footer class="footer">

    Sistema PROVSOFT · CIGARRO

  </footer>


</div>



<script>

function abrirApp(url){

  window.location.href = url;

}

</script>

</body>
</html>
