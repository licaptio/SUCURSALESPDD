<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROVSOFT | Consultor de Tickets - Allende 2</title>
<style>
:root{
  --bg:#f4f7fb;
  --panel:#fff;
  --line:#dbe3ee;
  --line2:#edf1f6;
  --text:#111827;
  --muted:#667085;
  --brand:#b51218;
  --brand-dark:#8f0e13;
  --soft:#fff5f5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.top{
  height:66px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#d82e35);color:#fff;display:grid;place-items:center;font-weight:950;font-size:20px}
.title{font-weight:900;font-size:17px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;color:#202938;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.wrap{max-width:1180px;margin:auto;padding:16px}
.controls{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
  display:grid;grid-template-columns:minmax(310px,1fr) minmax(260px,1fr) auto;gap:12px;align-items:end
}
.field label{display:block;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:6px}
.field select,.field input{width:100%;height:42px;border:1px solid #cfd8e5;border-radius:9px;padding:0 11px;background:#fff;color:#111827;outline:none}
.list{
  margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden
}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.list-head h2{font-size:16px;margin:0}
.badge{background:#eef2f7;color:#344054;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:850}
.week-text{font-size:12px;color:var(--muted);font-weight:750}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{background:#f8fafc;border-bottom:1px solid var(--line);padding:11px 14px;text-align:left;font-size:11px;color:#344054;text-transform:uppercase;font-weight:900}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line2);font-size:13px;color:#111827}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
td.date,td.ticket,td.time,td.amount{font-weight:800}
td.ticket{font-family:Consolas,monospace}
td.amount{text-align:right}
.open{width:1%;white-space:nowrap;text-align:right}
.open button{border:0;background:#fff0f1;color:var(--brand-dark);padding:7px 10px;border-radius:8px;font-weight:900;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:42px 15px}
.pager{
  padding:11px 14px;border-top:1px solid var(--line);background:#fafbfd;
  display:flex;justify-content:space-between;gap:12px;align-items:center
}
.page-info{font-size:12px;color:var(--muted);font-weight:750}
.page-buttons{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pg{height:34px;min-width:34px;padding:0 9px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:800;cursor:pointer}
.pg.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.pg:disabled{opacity:.4;cursor:default}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.84);display:none;align-items:center;justify-content:center;z-index:50;font-weight:900}
.loading.show{display:flex}

.ticket-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  padding:14px;
}
.ticket-card{
  position:relative;
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:15px;
  cursor:pointer;
  transition:.16s ease;
  min-height:126px;
}
.ticket-card:hover{
  border-color:#e3a5a8;
  background:#fffafa;
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(15,23,42,.07);
}
.ticket-card-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}
.ticket-card-date{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}
.ticket-card-number{
  margin-top:5px;
  font-family:Consolas,monospace;
  font-size:19px;
  font-weight:950;
  color:#111827;
}
.ticket-card-arrow{
  width:34px;height:34px;border-radius:9px;
  background:#fff0f1;color:var(--brand);
  display:grid;place-items:center;
  font-size:19px;font-weight:900;
  flex:0 0 auto;
}
.ticket-card-bottom{
  margin-top:18px;
  padding-top:12px;
  border-top:1px solid var(--line2);
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:end;
}
.ticket-card-label{
  font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;
}
.ticket-card-amount{
  margin-top:3px;font-size:17px;font-weight:950;color:#111827;
}
.ticket-card-hint{
  font-size:11px;color:var(--brand-dark);font-weight:850;
}

@media(max-width:720px){
  .top{padding:0 10px}.sub{display:none}.wrap{padding:10px}.controls{grid-template-columns:1fr}.controls .btn{width:100%}
  .list-head{align-items:flex-start;flex-direction:column}.ticket-grid{grid-template-columns:1fr}.pager{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">P</div>
    <div>
      <div class="title">PROVSOFT · Consultor de Tickets</div>
      <div class="sub">ALLENDE 2</div>
    </div>
  </div>
  <div style="display:flex;gap:8px"><button class="btn" id="backMain">← Tabla</button><button class="btn primary" id="reload">Actualizar</button></div>
</header>

<main class="wrap">
  <section class="controls">
    <div class="field">
      <label>Semana</label>
      <select id="weekSelect">
        <option value="">Cargando semanas...</option>
      </select>
    </div>
    <div class="field">
      <label>Buscar ticket</label>
      <input id="search" placeholder="Folio / ticket...">
    </div>
    <button class="btn primary" id="searchBtn">Buscar</button>
  </section>

  <section class="list">
    <div class="list-head">
      <div>
        <h2>Tickets</h2>
        <div class="week-text" id="weekText">Selecciona una semana</div>
      </div>
      <span class="badge" id="count">0 tickets</span>
    </div>

    <div class="ticket-grid" id="ticketGrid">
      <div class="empty" style="grid-column:1/-1">Configura tus keys de Firebase y presiona “Actualizar”.</div>
    </div>

    <div class="pager">
      <div class="page-info" id="pageInfo">Página 0 de 0</div>
      <div class="page-buttons" id="pageButtons"></div>
    </div>
  </section>
</main>

<div class="loading" id="loading">Consultando ventas…</div>

<script type="module">
const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "inventariopv-643f1.firebaseapp.com",
      projectId: "inventariopv-643f1",
      storageBucket: "inventariopv-643f1.firebasestorage.app",
      messagingSenderId: "96242533231",
      appId: "1:96242533231:web:aae75a18fbaf9840529e9a"
};

const SUCURSAL = "ALLENDE 2";
const PAGE_SIZE = 30;

let db=null, fs=null;
let rows=[], tickets=[], weeks=[], filtered=[];
let currentPage=1;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>Number(n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN"});

function parseFecha(s){
  const m=String(s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const d=new Date(+m[3],+m[2]-1,+m[1],12,0,0,0);
  return isNaN(d)?null:d;
}
function fmtDate(d){return d.toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"});}
function fmtTime(d){
  if(!d) return "—";
  return d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
}
function monday(date){
  const d=new Date(date), day=d.getDay();
  d.setDate(d.getDate()+(day===0?-6:1-day)); d.setHours(0,0,0,0); return d;
}
function sunday(date){const d=monday(date);d.setDate(d.getDate()+6);d.setHours(23,59,59,999);return d;}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

async function ensureFirebase(){
  if(db) return;
  const appMod=await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js");
  fs=await import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js");
  const app=appMod.initializeApp(firebaseConfig);
  db=fs.getFirestore(app);
}

async function load(){
  $("loading").classList.add("show");
  try{
    await ensureFirebase();
    const snap=await fs.getDocs(fs.collection(db,"TIENDAS",SUCURSAL,"ventas"));
    rows=snap.docs.map(doc=>{
      const x=doc.data();
      const fechaTxt=String(x.Fecha||x.fecha_origen_rpt||"");
      const fecha=parseFecha(fechaTxt);

      return {
        id:doc.id,
        fecha,fechaTxt,
        venta:String(x.Venta??""),
        codigo:String(x.Codigo??""),
        descripcion:String(x.descripcion??""),
        departamento:String(x.Departamento??""),
        cantidad:Number(x["Cantidad vendida"]||0),
        ventaPieza:Number(x["Venta pieza"]||0),
        ventaTotal:Number(x["venta Total"]||0),
        costoCompra:Number(x["Costo compra"]||0),
        costoTotal:Number(x["Costo total"]||0),
        utilidad:Number(x["Utilidad rpt"]||0),
        pctUtil:Number(x["% utilidad rpt"]||0),
        iva:Number(x["IVA ventas"]||0),
        cliente:String(x.Cliente??""),
        nombreCliente:String(x["nombre cliente"]??"PUBLICO EN GENERAL"),
        archivo:String(x.archivo_origen??""),
        linea:x.linea_origen??"",
        ajustado:Boolean(x.ajustado_manual),
        motivo:String(x.motivo_ajuste??""),
        sucursal:String(x.sucursal??SUCURSAL)
      };
    }).filter(r=>r.fecha && r.venta);

    groupTickets();
    buildWeeks();
    apply();
  }catch(err){
    console.error(err);
    $("ticketGrid").innerHTML=`<div class="empty" style="grid-column:1/-1">Error: ${esc(err.message)}</div>`;
  }finally{
    $("loading").classList.remove("show");
  }
}

function groupTickets(){
  const map=new Map();

  for(const r of rows){
    const key=`${dateKey(r.fecha)}|${r.venta}`;
    if(!map.has(key)){
      map.set(key,{
        key,
        fecha:r.fecha,
        fechaTxt:r.fechaTxt,
        venta:r.venta,
        total:0,
        partidas:[]
      });
    }
    const t=map.get(key);
    t.partidas.push(r);
    t.total+=r.ventaTotal;
  }

  tickets=[...map.values()].sort((a,b)=>{
    const fd=b.fecha-a.fecha;
    if(fd) return fd;
    return Number(b.venta||0)-Number(a.venta||0);
  });
}

function buildWeeks(){
  const map=new Map();
  for(const t of tickets){
    const start=monday(t.fecha), end=sunday(t.fecha), key=dateKey(start);
    if(!map.has(key)) map.set(key,{key,start,end,count:0});
    map.get(key).count++;
  }
  weeks=[...map.values()].sort((a,b)=>b.start-a.start);
  $("weekSelect").innerHTML=weeks.length
    ? weeks.map((w,i)=>`<option value="${w.key}" ${i===0?"selected":""}>${fmtDate(w.start)} al ${fmtDate(w.end)}</option>`).join("")
    : '<option value="">Sin semanas</option>';
}

function apply(){
  const key=$("weekSelect").value;
  const q=$("search").value.trim().toLowerCase();
  const w=weeks.find(x=>x.key===key);

  if(!w){filtered=[];render();return;}

  filtered=tickets.filter(t=>{
    if(t.fecha<w.start || t.fecha>w.end) return false;
    if(q && !String(t.venta).toLowerCase().includes(q)) return false;
    return true;
  });

  currentPage=1;
  $("weekText").textContent=`${fmtDate(w.start)} al ${fmtDate(w.end)}`;
  render();
}

function render(){
  $("count").textContent=`${filtered.length.toLocaleString("es-MX")} tickets`;

  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(currentPage>totalPages) currentPage=totalPages;

  const start=(currentPage-1)*PAGE_SIZE;
  const data=filtered.slice(start,start+PAGE_SIZE);

  if(!data.length){
    $("ticketGrid").innerHTML='<div class="empty" style="grid-column:1/-1">No hay tickets en esta semana.</div>';
  }else{
    $("ticketGrid").innerHTML=data.map(t=>`
      <article class="ticket-card" data-key="${esc(t.key)}" tabindex="0" role="button" aria-label="Abrir ticket ${esc(t.venta)}">
        <div class="ticket-card-top">
          <div>
            <div class="ticket-card-date">${esc(t.fechaTxt)}</div>
            <div class="ticket-card-number">Ticket ${esc(t.venta)}</div>
          </div>
          <div class="ticket-card-arrow">›</div>
        </div>
        <div class="ticket-card-bottom">
          <div>
            <div class="ticket-card-label">Importe</div>
            <div class="ticket-card-amount">${money(t.total)}</div>
          </div>
          <div class="ticket-card-hint">Abrir ticket</div>
        </div>
      </article>
    `).join("");

    $("ticketGrid").querySelectorAll(".ticket-card[data-key]").forEach(card=>{
      const go=()=>openTicket(card.dataset.key);
      card.addEventListener("click",go);
      card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
    });
  }

  const from=filtered.length?start+1:0;
  const to=Math.min(start+PAGE_SIZE,filtered.length);
  $("pageInfo").textContent=filtered.length?`Mostrando ${from}-${to} de ${filtered.length} · 30 por página`:"Sin registros";
  renderPager(totalPages);
}

function renderPager(totalPages){
  const wrap=$("pageButtons");
  if(filtered.length<=PAGE_SIZE){wrap.innerHTML="";return;}

  const parts=[];
  parts.push(`<button class="pg" data-page="${currentPage-1}" ${currentPage===1?"disabled":""}>‹</button>`);

  const set=new Set([1,totalPages,currentPage-2,currentPage-1,currentPage,currentPage+1,currentPage+2]);
  const pages=[...set].filter(p=>p>=1&&p<=totalPages).sort((a,b)=>a-b);
  let prev=0;
  for(const p of pages){
    if(prev && p-prev>1) parts.push('<span style="color:#98a2b3;padding:0 2px">…</span>');
    parts.push(`<button class="pg ${p===currentPage?"active":""}" data-page="${p}">${p}</button>`);
    prev=p;
  }
  parts.push(`<button class="pg" data-page="${currentPage+1}" ${currentPage===totalPages?"disabled":""}>›</button>`);
  wrap.innerHTML=parts.join("");

  wrap.querySelectorAll("button[data-page]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const p=Number(btn.dataset.page);
      if(p>=1&&p<=totalPages){currentPage=p;render();}
    });
  });
}

function openTicket(key){
  const t=tickets.find(x=>x.key===key);
  if(!t) return;
  sessionStorage.setItem("provsoft_ticket_actual",JSON.stringify({
    ...t,
    fecha:t.fecha.toISOString(),
    partidas:t.partidas.map(p=>({
      ...p,
      fecha:p.fecha.toISOString()
    }))
  }));
  window.location.href="ticket.html";
}

$("backMain").addEventListener("click",()=>window.location.href="index.html");
$("reload").addEventListener("click",load);
$("searchBtn").addEventListener("click",apply);
$("weekSelect").addEventListener("change",apply);
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")apply()});

ensureFirebase().catch(console.error);
</script>
</body>
</html>
