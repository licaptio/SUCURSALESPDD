<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículos nuevos</title>
  <link rel="icon" href="./favicon.ico" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <section id="pantallaCarga" class="pantalla-carga" aria-live="polite" aria-busy="true">
    <div class="carga-panel">
      <img src="./logo.jfif" class="logo-carga" alt="Logo" />
      <h1>Artículos nuevos</h1>
      <p id="mensajeCarga" class="mensaje-carga">Iniciando aplicación…</p>

      <div class="barra-carga" aria-hidden="true">
        <div id="progresoCarga" class="barra-carga-progreso"></div>
      </div>

      <p id="detalleCarga" class="detalle-carga">Preparando base local</p>
    </div>
  </section>

  <div id="aplicacion" class="aplicacion oculto">
    <header class="app-header">
      <div class="marca">
        <img src="./logo.jfif" class="logo-header" alt="Logo" />
        <div>
          <p class="eyebrow">PROVSOFT</p>
          <h1>Artículos nuevos</h1>
          <p class="subtitle">Los 50 productos más recientes del catálogo.</p>
          <p id="estadoFotos" class="subtitle estado-local"></p>
        </div>
      </div>

      <button id="btnRecargar" class="btn-secondary" type="button">Actualizar catálogo</button>
    </header>

    <main class="app-main">
      <section id="estado" class="estado oculto" aria-live="polite"></section>

      <section id="visor" class="visor oculto" aria-label="Listado de artículos nuevos">
        <button id="btnAnterior" class="flecha flecha-izquierda" type="button" aria-label="Página anterior">‹</button>

        <div class="contenido-visor">
          <div id="gridProductos" class="grid-productos"></div>

          <div class="paginacion">
            <span id="paginaActual">Página 1 de 1</span>
            <div id="puntosPagina" class="puntos-pagina" aria-hidden="true"></div>
          </div>
        </div>

        <button id="btnSiguiente" class="flecha flecha-derecha" type="button" aria-label="Página siguiente">›</button>
      </section>
    </main>
  </div>

  <template id="plantillaProducto">
    <article class="tarjeta-producto">
      <div class="foto-wrap">
        <img class="foto-producto" alt="" loading="lazy" />
        <span class="sin-foto">SIN FOTO</span>
      </div>

      <div class="tarjeta-contenido">
        <div class="producto-top">
          <span class="badge-nuevo">NUEVO</span>
          <span class="fecha-alta"></span>
        </div>

        <h2 class="concepto"></h2>
        <p class="codigo"></p>

        <div class="precios">
          <div class="precio-principal">
            <span>Precio público</span>
            <strong class="precio-publico"></strong>
          </div>

          <div class="precio-secundario">
            <span>Medio mayoreo</span>
            <strong class="medio-mayoreo"></strong>
          </div>

          <div class="precio-secundario">
            <span>Mayoreo</span>
            <strong class="mayoreo"></strong>
          </div>
        </div>

        <div class="mayoreo-piezas">
          <h3>Mayoreo por piezas</h3>
          <div class="lista-escalas"></div>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
