<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROVSOFT | Ticket</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--line:#dbe3ee;--text:#111827;--muted:#667085;--brand:#b51218;--brand-dark:#8f0e13}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}
.top{
  min-height:66px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:10
}
.left{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#d82e35);color:#fff;display:grid;place-items:center;font-weight:950;font-size:20px}
.title{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:#202938;padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.page{padding:24px 12px 40px;display:flex;justify-content:center}
.ticket{
  width:390px;max-width:100%;background:#fff;color:#000;padding:22px 20px;
  box-shadow:0 12px 32px rgba(15,23,42,.12);font-family:"Courier New",monospace
}
.brand-ticket{text-align:center;font-family:Arial,sans-serif;font-size:23px;font-weight:950}
.store{text-align:center;font-size:13px;font-weight:800;margin-top:5px}
.rule{border-top:1px dashed #000;margin:12px 0}
.meta{font-size:12px;line-height:1.55}
.items{width:100%;border-collapse:collapse;font-size:11px}
.items th,.items td{padding:5px 2px;vertical-align:top;border:0}
.items th{border-bottom:1px dashed #000;text-align:left}
.qty{width:46px;text-align:right}.amt{width:82px;text-align:right}
.product{font-weight:700;line-height:1.25}.code{font-size:10px;color:#444;margin-top:2px}
.totalrow{display:flex;justify-content:space-between;gap:15px;margin:5px 0;font-size:12px}
.grand{font-size:18px;font-weight:900;border-top:1px dashed #000;padding-top:9px;margin-top:9px}
.foot{text-align:center;font-size:11px;line-height:1.5;margin-top:15px}
.empty{background:#fff;padding:30px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
@media(max-width:600px){.top{align-items:flex-start}.sub{display:none}.actions{flex-direction:column}.page{padding:10px 0}.ticket{width:100%;box-shadow:none}}
@media print{
  body{background:#fff}
  .top{display:none}
  .page{padding:0}
  .ticket{width:80mm;max-width:80mm;box-shadow:none;padding:5mm 3mm}
  @page{margin:4mm}
}
</style>
</head>
<body>
<header class="top">
  <div class="left">
    <div class="logo">P</div>
    <div><div class="title">PROVSOFT · Ticket</div><div class="sub" id="headSub">ALLENDE 2</div></div>
  </div>
  <div class="actions">
    <button class="btn" id="back">← Regresar</button>
    <button class="btn primary" id="print">Imprimir</button>
  </div>
</header>

<main class="page">
  <article class="ticket" id="ticket"></article>
</main>

<script>
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const money=n=>Number(n||0).toLocaleString("es-MX",{style:"currency",currency:"MXN"});
const qty=n=>Number(n||0).toLocaleString("es-MX",{maximumFractionDigits:3});

const raw=sessionStorage.getItem("provsoft_ticket_actual");
if(!raw){
  document.getElementById("ticket").outerHTML='<div class="empty">No hay un ticket seleccionado. Regresa al consultor y abre uno.</div>';
}else{
  const t=JSON.parse(raw);
  document.title=`PROVSOFT | Ticket ${t.venta}`;
  document.getElementById("headSub").textContent=`ALLENDE 2 · Ticket ${t.venta}`;

  const items=[...(t.partidas||[])].sort((a,b)=>Number(a.linea||0)-Number(b.linea||0));
  const subtotal=items.reduce((a,p)=>a+Number(p.ventaTotal||0),0);

  document.getElementById("ticket").innerHTML=`
    <div class="brand-ticket">PROVSOFT</div>
    <div class="store">ALLENDE 2</div>

    <div class="rule"></div>

    <div class="meta">
      <div><b>FECHA:</b> ${esc(t.fechaTxt)}</div>
      <div><b>TICKET:</b> ${esc(t.venta)}</div>
      <div><b>CLIENTE:</b> ${esc(items[0]?.nombreCliente || "PUBLICO EN GENERAL")}</div>
    </div>

    <div class="rule"></div>

    <table class="items">
      <thead>
        <tr><th>ARTÍCULO</th><th class="qty">CANT.</th><th class="amt">IMPORTE</th></tr>
      </thead>
      <tbody>
        ${items.map(p=>`
          <tr>
            <td>
              <div class="product">${esc(p.descripcion)}</div>
              <div class="code">${esc(p.codigo)} · ${money(p.ventaPieza)} c/u</div>
            </td>
            <td class="qty">${qty(p.cantidad)}</td>
            <td class="amt">${money(p.ventaTotal)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <div class="rule"></div>

    <div class="totalrow grand"><span>TOTAL</span><span>${money(subtotal)}</span></div>

    <div class="foot">
      <div>Gracias por su compra</div>
      <div>PROVSOFT · ALLENDE 2</div>
    </div>
  `;
}

document.getElementById("back").addEventListener("click",()=>{ if(history.length>1) history.back(); else window.location.href="visor_tickets.html"; });
document.getElementById("print").addEventListener("click",()=>window.print());
</script>
</body>
</html>
